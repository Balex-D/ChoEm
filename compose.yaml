services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: choem
      POSTGRES_DB: choem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choem -d choem"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      DATABASE_URL: postgresql://choem:${POSTGRES_PASSWORD}@db:5432/choem
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  postgres_data:
